name: Stripe payment alerts → Slack

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (UTC; GitHub may delay under load — harmless, job self-heals)
  workflow_dispatch: {}       # allow manual runs for testing

concurrency:
  group: stripe-alerts
  cancel-in-progress: false   # never kill a run mid-post; dedup makes overlap safe anyway

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Composio CLI
        run: |
          # NOTE: 0.2.27's linux binary was removed from releases and @composio/cli
          # isn't on npm, so we can't pin — only the latest GitHub-release binary works.
          curl -fsSL https://composio.dev/install | bash
          echo "$HOME/.composio" >> "$GITHUB_PATH"

      - name: Authenticate Composio (non-interactive)
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          # Bare login: 0.2.28's `--org` flag returns HTTP 404; the API key's default
          # org (ok_npdCOmMXWGXM) is correct without it. Dedup/enrichment are org-agnostic.
          composio login --user-api-key "$COMPOSIO_API_KEY"
          echo "=== cloud whoami ===" && composio whoami

      - name: Run payment alerts
        env:
          ALERTS_DRYRUN: "1"   # TEMP: verify context on 0.2.28 bare login (no posting)
        run: python3 stripe_payment_alerts.py
