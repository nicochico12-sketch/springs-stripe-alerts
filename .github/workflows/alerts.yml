name: Stripe payment alerts → Slack

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (UTC; GitHub may delay under load — harmless, job self-heals)
  workflow_dispatch:
    inputs:
      dryrun:
        description: "Dry run (enrich + print, no Slack posts)"
        type: boolean
        default: false
      force_fail:
        description: "Simulate a failure (to test the Slack failure alert)"
        type: boolean
        default: false

concurrency:
  group: stripe-alerts
  cancel-in-progress: false   # never kill a run mid-post; dedup makes overlap safe anyway

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No installs: the script is stdlib-only and calls Stripe + Slack REST APIs
      # directly. (The old Composio CLI install step was the source of every
      # failure Jul 7–16 — installer flakes on shared-runner IPs.)
      - name: Run payment alerts
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ALERTS_DRYRUN: ${{ inputs.dryrun == true && '1' || '' }}
        run: |
          if [ "${{ inputs.force_fail }}" = "true" ]; then
            echo "force_fail=true → simulating a failure to test the alert"; exit 1
          fi
          python3 stripe_payment_alerts.py

      # Safety net: if the run failed, post a heads-up into the channel so a
      # silent breakage never hides incoming payments. GitHub also emails on failure.
      - name: Alert Slack on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS --retry 3 https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"channel\":\"C0B6FENKU2K\",\"unfurl_links\":false,\"text\":\":warning: *Payment alerts run FAILED.* New Stripe payments may not be posted until this is fixed.\n<$RUN_URL|View the failed run> · then re-run once resolved (the 72h backfill will catch anything missed).\"}" \
            || echo "WARN: failure alert could not post (GitHub email still sent)"
