name: Stripe payment alerts → Slack

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (UTC; GitHub may delay under load — harmless, job self-heals)
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Simulate a failure (to test the Slack failure alert)"
        type: boolean
        default: false

concurrency:
  group: stripe-alerts
  cancel-in-progress: false   # never kill a run mid-post; dedup makes overlap safe anyway

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Composio CLI
        run: |
          # NOTE: 0.2.27's linux binary was removed from releases and @composio/cli
          # isn't on npm, so we can't pin — only the latest GitHub-release binary works.
          curl -fsSL https://composio.dev/install | bash
          echo "$HOME/.composio" >> "$GITHUB_PATH"

      - name: Authenticate Composio (non-interactive)
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          # Bare login: 0.2.28's `--org` flag returns HTTP 404; the API key's default
          # org (ok_npdCOmMXWGXM) is correct without it. Dedup/enrichment are org-agnostic.
          composio login --user-api-key "$COMPOSIO_API_KEY"
          echo "=== cloud whoami ===" && composio whoami

      - name: Run payment alerts
        run: |
          if [ "${{ inputs.force_fail }}" = "true" ]; then
            echo "force_fail=true → simulating a failure to test the alert"; exit 1
          fi
          python3 stripe_payment_alerts.py

      # Safety net: if ANY step above failed, post a heads-up into the channel so a
      # silent breakage never hides incoming payments. Best-effort (bare login works
      # even through the kind of CLI drift we hit); GitHub also emails on failure.
      - name: Alert Slack on failure
        if: failure()
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          command -v composio >/dev/null 2>&1 || { curl -fsSL https://composio.dev/install | bash; export PATH="$HOME/.composio:$PATH"; }
          composio login --user-api-key "$COMPOSIO_API_KEY" >/dev/null 2>&1 || true
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat > /tmp/fail.json <<EOF
          {"channel":"C0B6FENKU2K","unfurl_links":false,"markdown_text":":warning: *Payment alerts run FAILED.* New Stripe payments may not be posted until this is fixed.\n<$RUN_URL|View the failed run> · then re-run once resolved (the 72h backfill will catch anything missed)."}
          EOF
          composio execute SLACK_SEND_MESSAGE -d @/tmp/fail.json || echo "WARN: failure alert could not post (GitHub email still sent)"
