name: Stripe payment alerts → Slack

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (UTC; GitHub may delay under load — harmless, job self-heals)
  workflow_dispatch: {}       # allow manual runs for testing

concurrency:
  group: stripe-alerts
  cancel-in-progress: false   # never kill a run mid-post; dedup makes overlap safe anyway

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Composio CLI
        run: |
          # PIN the version: 0.2.28 regressed — `composio login --org` returns HTTP 404.
          # The installer takes a version-tag arg; pass it through the pipe.
          curl -fsSL https://composio.dev/install | bash -s -- "@composio/cli@0.2.27"
          echo "$HOME/.composio" >> "$GITHUB_PATH"

      - name: Authenticate Composio (non-interactive)
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          # --user-api-key is a self-contained direct-login path; pin org to match local context
          composio login --user-api-key "$COMPOSIO_API_KEY" --org ok_npdCOmMXWGXM
          echo "=== cloud whoami ===" && composio whoami

      - name: Run payment alerts
        run: |
          export COMPOSIO_BIN="$HOME/.composio/composio"
          python3 stripe_payment_alerts.py
